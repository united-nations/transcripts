name: CI

on:
  pull_request:
  # Called by the deploy workflow (main_un-transcripts.yml) on push to main so
  # the same gate that protects PRs also blocks a bad deploy. Not triggered on
  # `push` directly — that would run the suite twice per push (once standalone,
  # once via the deploy call). The deploy call is the source of truth for main.
  workflow_call:

# The repo default is already read-only, but that is a settings checkbox someone
# can flip. Pinning it here makes the grant explicit and non-negotiable.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Audio timeline regressions exercise the real conversion with local
      # synthetic fixtures; do not depend on optional runner-image tools.
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Blocking gate — protects the deterministic data-processing logic and
      # types. The Layer 1 test suite runs fully offline (a dummy DATABASE_URL
      # is injected by vitest.config.ts; nothing connects).
      - run: pnpm typecheck
      - run: pnpm test
      # Blocking: errors fail the build. The advisory React Compiler rules
      # (set-state-in-effect, immutability) are configured as warnings.
      - run: pnpm lint

      # public/openapi.json is a checked-in build artifact generated from the
      # Zod schemas in lib/openapi/. Nothing regenerates it at build time (the
      # Docker context excludes scripts/), so the served spec silently drifts
      # from the code whenever someone edits spec.ts/schemas.ts and forgets
      # `pnpm generate-openapi` — which is exactly how the spec came to omit
      # the whole full-text-search surface. This guard fails the build instead.
      - run: pnpm check-openapi
